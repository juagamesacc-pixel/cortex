name: Build Cortex (Webapp & Android APK)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to produce'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-integrate:
    name: Build React Webapp & Android Host APK
    runs-on: ubuntu-latest

    steps:
      # ─── Step 1: Checkout ───
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─── Step 2: Environment Setup (Node.js & pnpm) ───
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'client/pnpm-lock.yaml'

      # ─── Step 3: Build React Client Webapp ───
      - name: Install Webapp Dependencies
        working-directory: client
        run: |
          echo "Installing frontend dependencies..."
          pnpm install --no-frozen-lockfile

      - name: Compile React Webapp (Vite Production Build)
        working-directory: client
        run: |
          echo "Building production webapp bundle..."
          pnpm run build
          echo "Verifying webapp build output..."
          test -f dist/index.html || { echo "Error: dist/index.html was not generated!"; exit 1; }
          ls -la dist/

      # ─── Step 4: Archive & Upload Standalone Webapp ───
      - name: Upload Standalone Webapp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-webapp-bundle
          path: client/dist/
          retention-days: 14

      # ─── Step 5: Integrate Webapp into Android Host Assets ───
      - name: Synchronize Webapp into Android Assets
        run: |
          echo "Syncing React webapp bundle into Android asset directory..."
          TARGET_ASSETS_DIR="android/app/src/main/assets/cortex"
          rm -rf "$TARGET_ASSETS_DIR"
          mkdir -p "$TARGET_ASSETS_DIR"
          cp -r client/dist/* "$TARGET_ASSETS_DIR/"

          echo "Validating Android assets integration..."
          test -f "$TARGET_ASSETS_DIR/index.html" || { echo "Error: Asset synchronization failed!"; exit 1; }
          echo "Successfully synchronized assets:"
          ls -la "$TARGET_ASSETS_DIR"

      # ─── Step 6: Setup Java & Android SDK ───
      - name: Setup Java (Temurin JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ─── Step 7: Permissions & Validation ───
      - name: Grant Execute Permissions to Gradle Wrapper
        working-directory: android
        run: chmod +x gradlew

      # ─── Step 8: Build Android Host APK (Debug) ───
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == null }}
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          echo "Building Android Debug APK..."
          ./gradlew assembleDebug --stacktrace
          ls -la app/build/outputs/apk/debug/

      # ─── Step 9: Build Android Host APK (Release) ───
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' }}
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building Android Release APK (unsigned if no secrets provided)..."
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleReleaseUnsigned --stacktrace || true
          ls -la app/build/outputs/apk/release/ || true

      # ─── Step 10: Upload Android Artifacts ───
      - name: Upload Debug APK Artifact
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == null }}
        uses: actions/upload-artifact@v4
        with:
          name: cortex-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: ${{ (github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release') && hashFiles('android/app/build/outputs/apk/release/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ─── Step 11: Generate Build Summary ───
      - name: Publish GitHub Step Summary
        run: |
          echo "## 🚀 Cortex Unified Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Location / Output |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **React Webapp** | ✅ Built & Packaged | \`client/dist/\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android Assets** | ✅ Integrated | \`android/app/src/main/assets/cortex/\` |" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "android/app/build/outputs/apk/debug" ]; then
            DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" -exec basename {} \; | head -n 1)
            DEBUG_SIZE=$(find android/app/build/outputs/apk/debug -name "*.apk" -exec du -h {} \; | awk '{print $1}' | head -n 1)
            echo "| **Debug APK** | ✅ $DEBUG_APK ($DEBUG_SIZE) | Available in Artifacts |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -d "android/app/build/outputs/apk/release" ]; then
            RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" -exec basename {} \; | head -n 1)
            if [ -n "$RELEASE_APK" ]; then
              RELEASE_SIZE=$(find android/app/build/outputs/apk/release -name "*.apk" -exec du -h {} \; | awk '{print $1}' | head -n 1)
              echo "| **Release APK** | ✅ $RELEASE_APK ($RELEASE_SIZE) | Available in Artifacts |" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Both the standalone webapp and the integrated Android APK were compiled in a single workflow run." >> $GITHUB_STEP_SUMMARY
